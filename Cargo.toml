[workspace]
members = ["daemonkit", "daemonkit-testkit"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akiselev/daemonkit"

[workspace.dependencies]
daemonkit = { path = "daemonkit", version = "0.1.0", default-features = false }
futures-core = "0.3"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
tempfile = "3.12"
