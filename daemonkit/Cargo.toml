[package]
name = "daemonkit"
description = "Secure, cross-platform local daemon lifecycle runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["runtime-tokio", "native-transport", "native-process"]
runtime-tokio = ["dep:tokio"]
native-transport = []
native-process = []
blocking = ["runtime-tokio"]
advanced = []
testkit = []

[dependencies]
futures-core.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
trybuild = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
